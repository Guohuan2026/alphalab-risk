# Continuous integration: lint + offline test suite on every push and pull request.
# Uses the exact package versions in requirements-lock.txt (the environment behind every
# logged result). Live-network tests (`pytest -m network`) are excluded by default.
# Note: on a private repository each run uses GitHub Actions minutes (Linux runner, ~5 min).
name: tests

on:
  push:
  pull_request:

# Least privilege: the job only reads the repository. No write scopes, no secrets.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false   # do not leave the token in .git/config

      - name: Install uv and Python 3.12
        uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"

      - name: Install AlphaLab with locked dependency versions
        run: |
          uv venv --python 3.12 .venv
          uv pip install --python .venv/bin/python -e ".[dev]" -c requirements-lock.txt

      - name: Lint
        run: |
          .venv/bin/ruff check .
          .venv/bin/ruff format --check .

      - name: Offline tests
        run: .venv/bin/python -m pytest -q
