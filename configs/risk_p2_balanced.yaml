# AlphaLab-Risk P2: global balanced "60/40" policy portfolio (pension-fund style template).
# 60% equity (SPY US 40%, EFA developed ex-US 20%), 40% fixed income (IEF 7-10y Treasuries
# 30%, LQD IG corporates 10%). All USD-listed ETFs on NYSE/NASDAQ. Monthly rebalance.
# Bond ETFs start 2002-07-30, so the 1,000-session minimum window still leaves the GFC
# out-of-sample.
provider: yahoo
universe: [SPY, EFA, IEF, LQD]
start: "2002-07-01"
end: "2026-10-30"
data_dir: data
monthly_min_obs: 15
calendar: XNYS
provider_options:
  pause_seconds: 0.5
  max_retries: 2
validation:
  extreme_return: 0.4
  max_gap_sessions: 5
  vendor_adj_tolerance: 0.002
portfolio:
  name: p2_balanced_60_40
  weights: {SPY: 0.40, EFA: 0.20, IEF: 0.30, LQD: 0.10}
  rebalance: monthly
features:
  yahoo_levels: ["^VIX"]
  fred: [BAA10Y, T10Y3M]
  fred_lag_sessions: 1
  range_asset: SPY       # equity sleeve's range as a stress proxy (no OHLC for a portfolio)
risk:                    # docs/RESEARCH_DESIGN.md §4-5; `alphalab forecast` then `alphalab backtest`
  alphas: [0.01, 0.025, 0.05]   # tail probabilities: VaR 99% / 97.5% / 95%
  min_train: 1000        # ~4 years of history before the first forecast
  refit_every: 21        # re-estimate parameters monthly; filters update daily
  window: expanding
  oos_start: "1997-01-02"   # first origin (later if 1000 sessions are not yet available)
  lockbox_start: "2023-01-01" # held out: opened ONCE with --include-lockbox
  models:
    - {type: hs, window: 250}
    - {type: hs, window: 500}
    - {type: ewma, lam: 0.94}
    - {type: garch}        # GARCH(1,1)-t
    - {type: gjr}          # GJR-GARCH(1,1)-t (leverage)
    - {type: fhs}          # filtered HS: GJR volatility x empirical residual tails
