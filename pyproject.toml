[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "alphalab"
version = "0.1.0"
description = "AlphaLab: an educational, production-style quantitative investment research platform"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Guohuan Yu" }]
dependencies = [
    "exchange_calendars>=4.5",
    "numpy>=1.26",
    "pandas>=2.2",
    "pyarrow>=15",
    "pyyaml>=6",
    "yfinance>=0.2.54",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.6"]

[project.scripts]
alphalab = "alphalab.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Network tests hit Yahoo live; they are skipped unless you run `pytest -m network`.
addopts = "-ra -m 'not network'"
markers = ["network: downloads live data from the internet (deselected by default)"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "NPY"]
